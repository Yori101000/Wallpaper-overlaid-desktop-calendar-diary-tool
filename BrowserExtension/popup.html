<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      min-height: 180px;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      background: #1C1F26;
      color: #F0F2F5;
      padding: 16px;
    }
    h2 {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.02em;
      margin-bottom: 14px;
    }
    .row {
      padding: 10px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .row:first-of-type { border-top: none; padding-top: 0; }
    .label {
      font-size: 11px;
      color: #8A93A0;
      margin-bottom: 4px;
    }
    .value {
      font-size: 13px;
      font-weight: 500;
    }
    .value.online { color: #2EC4B6; }
    .value.offline { color: #EF476F; }
    .text {
      font-size: 13px;
      color: #D8DCE3;
      word-break: break-all;
      line-height: 1.45;
    }
    .meta {
      font-size: 11px;
      color: #8A93A0;
      margin-top: 4px;
    }
    .empty {
      font-size: 13px;
      color: #8A93A0;
    }
    .hint {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      line-height: 1.6;
      color: #8A93A0;
    }
    .hint b {
      color: #F0F2F5;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h2>划线保存到透明日历</h2>
  <div class="row">
    <div class="label">桌面应用</div>
    <div class="value" id="appStatus">检测中…</div>
  </div>
  <div class="row">
    <div class="label">最近保存</div>
    <div id="lastSavedContent">
      <div class="empty">暂无保存记录</div>
    </div>
  </div>
  <div class="hint">
    在网页上选中文字，右键 <b>划线保存到透明日历</b>，或按 <b>Ctrl+Shift+S</b>。
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
